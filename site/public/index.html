<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MU Explorer</title>
  <meta name="description" content="Itens, monstros, spots e builds de MU Online.">
  <style>
    :root { --bg: #f7f6f2; --fg: #1d1c1a; --muted: #6b6860; --accent: #8a5a00; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151412; --fg: #eceae4; --muted: #a29e94; --accent: #e0a840; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
    h1 { margin: 0 0 .25rem; font-size: 2rem; }
    .tag { color: var(--accent); font-weight: 600; margin: 0 0 2rem; }
    ul { padding-left: 1.2rem; }
    footer { margin-top: 3rem; color: var(--muted); font-size: .875rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>MU Explorer</h1>
    <p class="tag">Em construção</p>
    <p>Uma base de consulta de MU Online:</p>
    <ul>
      <li>Itens: requisitos, opções e onde dropam</li>
      <li>Monstros: atributos e tabelas de drop</li>
      <li>Spots: mapa → monstros → drops</li>
      <li>Builds por classe</li>
    </ul>
    <footer>
      Projeto de fãs, sem vínculo com a Webzen. MU Online é marca da Webzen Inc.
    </footer>
  </main>
</body>
</html>
