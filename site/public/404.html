<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · MU Explorer</title>
  <style>
    body { margin: 0; background: #0c0e13; color: #e8e4da; font: 16px/1.6 system-ui, sans-serif; }
    a { color: #e2b45c; }
    main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
  </style>
</head>
<body><main><h1 data-en="Page not found">Página não encontrada</h1><p><a href="/" data-en="Back to home">Voltar ao início</a></p></main>
<script>
  // Idioma escolhido no site (mu-explorer:lang): esta página não usa o layout, então troca os dois textos aqui.
  try {
    if (localStorage.getItem("mu-explorer:lang") === "en") {
      document.documentElement.lang = "en";
      document.title = "Page not found · MU Explorer";
      document.querySelectorAll("[data-en]").forEach((el) => { el.textContent = el.dataset.en; });
    }
  } catch {}
</script>
</body>
</html>
