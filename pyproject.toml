[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu-explorer"
version = "0.1.0"
description = "Coleta, normalização e publicação de dados de MU Online (itens, monstros, spots, drops)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "selectolax>=0.3.21",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["scrapers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
