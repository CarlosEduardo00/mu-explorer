<html><body>
<script type="text/javascript">
    var totalStats_gl = 2963;
    var fruitPoints_gl = 127;
    var STRbase_gl = 30;
    var AGIbase_gl = 30;
    var STAbase_gl = 25;
    var ENEbase_gl = 24;
    
    //BUILD 1
    var STRfactor1_gl = 0.55;
    var AGIfactor1_gl = 0.25;
    var STAfactor1_gl = 0.15;
    var ENEfactor1_gl = 0.05;
    
    //BUILD 2
    var STRfactor2_gl = 0.35;
    var AGIfactor2_gl = 0.50;
    var STAfactor2_gl = 0.10;
    var ENEfactor2_gl = 0.05;
    
    function setLevel_gl(){
        var temp_gl = totalStats_gl;
        var levelInput = document.getElementById("levelInput_gl").value;
        if (
            (levelInput > 0) &&
            (levelInput < 2)
            ){
            temp_gl = 0;
        }
        else if (
            (levelInput > 1) &&
            (levelInput < 400)
            ){
            temp_gl = (levelInput * 7);
        }
        else if (
            (levelInput > 399) &&
            (levelInput < 800)
            ){
            temp_gl = (totalStats_gl - 100);
        }
        
        updateData_gl(temp_gl);
    }
    
    function updateData_gl(tempstats){
        //1ST BUILD
        //STRENGTH
        var temp1_gl = tempstats;
        var str1 = (Math.round(temp1_gl * STRfactor1_gl));
        str1 = (str1 + STRbase_gl);
        document.getElementById("str1_gl").innerHTML=str1;
        document.getElementById("str1_factor_gl").innerHTML=(Math.round(STRfactor1_gl * 100));
        document.getElementById("str1_fruitPoints_gl").innerHTML=(Math.round(STRfactor1_gl * fruitPoints_gl));
        //AGILITY
        var agi1 = (Math.round(temp1_gl * AGIfactor1_gl));
        agi1 = (agi1 + AGIbase_gl);
        document.getElementById("agi1_gl").innerHTML=agi1;
        document.getElementById("agi1_factor_gl").innerHTML=(Math.round(AGIfactor1_gl * 100));
        document.getElementById("agi1_fruitPoints_gl").innerHTML=(Math.round(AGIfactor1_gl * fruitPoints_gl));
        //STAMINA
        var sta1 = (Math.round(temp1_gl * STAfactor1_gl));
        sta1 = (sta1 + STAbase_gl);
        document.getElementById("sta1_gl").innerHTML=sta1;
        document.getElementById("sta1_factor_gl").innerHTML=(Math.round(STAfactor1_gl * 100));
        document.getElementById("sta1_fruitPoints_gl").innerHTML=(Math.round(STAfactor1_gl * fruitPoints_gl));
        //ENERGY
        var ene1 = (Math.round(temp1_gl * ENEfactor1_gl));
        ene1 = (ene1 + ENEbase_gl);
        document.getElementById("ene1_gl").innerHTML=ene1;
        document.getElementById("ene1_factor_gl").innerHTML=(Math.round(ENEfactor1_gl * 100));
        document.getElementById("ene1_fruitPoints_gl").innerHTML=(Math.round(ENEfactor1_gl * fruitPoints_gl));

        //2ND BUILD
        //STRENGTH
        var temp2_gl = tempstats;
        var str2 = (Math.round(temp2_gl * STRfactor2_gl));
        str2 = (str2 + STRbase_gl);
        document.getElementById("str2_gl").innerHTML=str2;
        document.getElementById("str2_factor_gl").innerHTML=(Math.round(STRfactor2_gl * 100));
        document.getElementById("str2_fruitPoints_gl").innerHTML=(Math.round(STRfactor2_gl * fruitPoints_gl));
        //AGILITY
        var agi2 = (Math.round(temp2_gl * AGIfactor2_gl));
        agi2 = (agi2 + AGIbase_gl);
        document.getElementById("agi2_gl").innerHTML=agi2;
        document.getElementById("agi2_factor_gl").innerHTML=(Math.round(AGIfactor2_gl * 100));
        document.getElementById("agi2_fruitPoints_gl").innerHTML=(Math.round(AGIfactor2_gl * fruitPoints_gl));
        //STAMINA
        var sta2 = (Math.round(temp2_gl * STAfactor2_gl));
        sta2 = (sta2 + STAbase_gl);
        document.getElementById("sta2_gl").innerHTML=sta2;
        document.getElementById("sta2_factor_gl").innerHTML=(Math.round(STAfactor2_gl * 100));
        document.getElementById("sta2_fruitPoints_gl").innerHTML=(Math.round(STAfactor2_gl * fruitPoints_gl));
        //ENERGY
        var ene2 = (Math.round(temp2_gl * ENEfactor2_gl));
        ene2 = (ene2 + ENEbase_gl);
        document.getElementById("ene2_gl").innerHTML=ene2;
        document.getElementById("ene2_factor_gl").innerHTML=(Math.round(ENEfactor2_gl * 100));
        document.getElementById("ene2_fruitPoints_gl").innerHTML=(Math.round(ENEfactor2_gl * fruitPoints_gl));

    }
    </script>
